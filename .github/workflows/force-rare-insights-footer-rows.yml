name: Force RARE INSIGHTS footer rows

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/force-rare-insights-footer-rows.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply footer rows
        run: python3 .github/scripts/force_rare_insights_footer_rows.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit footer rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/MagazinePageLayouts.tsx
          git commit -m "Force RARE INSIGHTS footer band on layout pages"
          git push origin main
