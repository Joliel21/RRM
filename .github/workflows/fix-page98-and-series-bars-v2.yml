name: Fix page 98 and series bars v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-page98-and-series-bars-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply correction
        run: python3 .github/scripts/fix_page98_and_series_bars_v2.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ReadingView.tsx
          git commit -m "Correct page 98 copy and series bars"
          git push origin main
