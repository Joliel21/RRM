name: Consolidate runnable into RRM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-runnable-into-rrm.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RRM
        uses: actions/checkout@v4
        with:
          path: rrm

      - name: Check out current runnable source
        uses: actions/checkout@v4
        with:
          repository: Joliel21/RRM-Runnable
          ref: main
          path: runnable

      - name: Copy runnable source into RRM
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          rm -rf rrm/src rrm/WORKING
          cp -R runnable/src rrm/src
          cp -R runnable/WORKING rrm/WORKING

          for file in \
            index.html \
            package.json \
            package-lock.json \
            postcss.config.mjs \
            vite.config.ts \
            vite.config.wp.ts \
            RARE_INSIGHTS_STRUCTURE.md \
            RRM_NPM_SOURCE_1.0.29_NOTES.md \
            RRM_PAGE_MAP.md \
            RUN_WITH_NPM.txt \
            SPONSORS_AND_ORGANIZATIONS.md; do
            if [ -f "runnable/$file" ]; then
              cp "runnable/$file" "rrm/$file"
            fi
          done

          cat > rrm/src/app/config/repository-assets.ts <<'EOF'
          import { getDataUrl, getOrganizationRawBaseUrl } from "@/app/config/data-source";

          const REMOVED_ASSET_PATHS = new Set([
            "images/tea.png",
            "series-cover/resources.png",
          ]);

          const normalizeRepositoryPath = (value: string) =>
            value
              .replace(/^public\//i, "")
              .replace(/^\/+/, "");

          const isRemovedAssetPath = (value: string) =>
            REMOVED_ASSET_PATHS.has(normalizeRepositoryPath(value));

          /** Resolve assets stored under magazine-source/public. */
          export function resolveRepositoryAssetUrl(value?: string | null): string {
            const rawValue = String(value || "").trim();
            if (!rawValue) return "";

            if (/^(?:https?:|data:|blob:)/i.test(rawValue) || rawValue.startsWith("//")) {
              return rawValue;
            }

            if (isRemovedAssetPath(rawValue)) return "";

            let normalizedPath = normalizeRepositoryPath(rawValue);
            if (normalizedPath === "images/bsyndro.png") {
              normalizedPath = "images/bardet_biedl_syndrome.png";
            }

            // During local RRM development these assets are in this same repository.
            return `/magazine-source/public/${normalizedPath}`;
          }

          /** Resolve assets stored at the RRM repository root. */
          export function resolveRepositoryRootAssetUrl(value?: string | null): string {
            const rawValue = String(value || "").trim();
            if (!rawValue) return "";

            if (/^(?:https?:|data:|blob:)/i.test(rawValue) || rawValue.startsWith("//")) {
              return rawValue;
            }

            if (isRemovedAssetPath(rawValue)) return "";
            return `/${normalizeRepositoryPath(rawValue)}`;
          }

          /** Resolve an organization-owned logo, sponsor image, or issue asset. */
          export function resolveOrganizationAssetUrl(value?: string | null): string {
            const rawValue = String(value || "").trim();
            if (!rawValue) return "";

            if (/^(?:https?:|data:|blob:)/i.test(rawValue) || rawValue.startsWith("//")) {
              return rawValue;
            }

            const organizationBase = getOrganizationRawBaseUrl();
            if (!organizationBase) return resolveRepositoryAssetUrl(rawValue);
            return `${organizationBase}${rawValue.replace(/^\/+/, "")}`;
          }
          EOF

          # The page swap belongs in page assignments, not in the asset resolver.
          python - <<'PY'
          from pathlib import Path
          p = Path('rrm/src/app/App.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'imageUrl: resolveRepositoryRootAssetUrl("/images/ads/insider.png"),\n              alt: "RARE Revolution Insider membership spread",',
              'imageUrl: resolveRepositoryRootAssetUrl("/images/rare-revolution-series-spread.png"),\n              alt: "RARE Revolution Explore the Series spread",',
              2,
          )
          s = s.replace(
              'imageUrl: resolveRepositoryRootAssetUrl(\n                "/images/rare-revolution-series-spread.png",\n              ),\n              alt: "RARE Revolution Explore the Series spread, left page",',
              'imageUrl: resolveRepositoryRootAssetUrl("/images/ads/insider.png"),\n              alt: "RARE Revolution Insider membership spread, left page",',
              1,
          )
          s = s.replace(
              'imageUrl: resolveRepositoryRootAssetUrl(\n                "/images/rare-revolution-series-spread.png",\n              ),\n              alt: "RARE Revolution Explore the Series spread, right page",',
              'imageUrl: resolveRepositoryRootAssetUrl("/images/ads/insider.png"),\n              alt: "RARE Revolution Insider membership spread, right page",',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit consolidated runnable source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/rrm"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src WORKING index.html package.json package-lock.json postcss.config.mjs vite.config.ts vite.config.wp.ts RARE_INSIGHTS_STRUCTURE.md RRM_NPM_SOURCE_1.0.29_NOTES.md RRM_PAGE_MAP.md RUN_WITH_NPM.txt SPONSORS_AND_ORGANIZATIONS.md
          if git diff --cached --quiet; then
            echo "No runnable changes to commit."
            exit 0
          fi
          git commit -m "Consolidate current runnable source into RRM"
          git push origin main
