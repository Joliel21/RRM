name: Apply series color rule

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/match-rare-insights-archive-colors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply series theme treatment
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/app/components/ReadingView.tsx')
          s = p.read_text(encoding='utf-8')

          helper_marker = 'const PageContent = ({\n'
          if 'const SERIES_THEME_RULES' not in s:
              helper = r'''type SeriesThemeRule = {
  key: string;
  color: string;
};

const SERIES_THEME_RULES = {
  rareInsights: { key: "rare-insights", color: "#C99B38" },
  peopleOfRare: { key: "people-of-rare", color: "#111111" },
  digitalSpotlight: { key: "digital-spotlight", color: "#00AEEF" },
  charityPartners: { key: "charity-partners", color: "#69B83E" },
  rareReports: { key: "rare-reports", color: "#7650A4" },
  resources: { key: "resources", color: "#169C9C" },
} as const satisfies Record<string, SeriesThemeRule>;

const getSeriesThemeRule = (page: MagazinePage): SeriesThemeRule | null => {
  const identity = [page.id, page.layoutId, page.imageUrl, page.alt]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  if (
    identity.includes("digital-spotlight") ||
    identity.includes("digital spotlight")
  ) {
    return SERIES_THEME_RULES.digitalSpotlight;
  }

  if (
    identity.includes("people-of-rare") ||
    identity.includes("people of rare") ||
    identity.includes("ceo-series") ||
    identity.includes("ceo series") ||
    identity.includes("patient-engagement") ||
    identity.includes("patient engagement") ||
    identity.includes("rare-entrepreneur") ||
    identity.includes("rare entrepreneur")
  ) {
    return SERIES_THEME_RULES.peopleOfRare;
  }

  if (
    identity.includes("charity-partners") ||
    identity.includes("charity partners") ||
    identity.includes("rare-charities")
  ) {
    return SERIES_THEME_RULES.charityPartners;
  }

  if (
    identity.includes("rare-reports") ||
    identity.includes("rare reports") ||
    identity.includes("rare-siblings") ||
    identity.includes("rare siblings") ||
    identity.includes("bbs-report")
  ) {
    return SERIES_THEME_RULES.rareReports;
  }

  if (
    identity.includes("resources") ||
    identity.includes("rare resources")
  ) {
    return SERIES_THEME_RULES.resources;
  }

  if (
    identity.includes("rare-insights") ||
    identity.includes("rare insights") ||
    Boolean(RARE_INSIGHTS_ARCHIVE_TITLE_ART[page.pageNumber])
  ) {
    return SERIES_THEME_RULES.rareInsights;
  }

  return null;
};

'''
              if helper_marker not in s:
                  raise SystemExit('PageContent marker not found')
              s = s.replace(helper_marker, helper + helper_marker, 1)

          old_state = '''  const isFullBleedSpreadPage = fullBleedSpreadPages.has(page.pageNumber);\n  const rareInsightsTitleColor = useRareInsightsTitleColor(page.pageNumber);\n'''
          new_state = '''  const isFullBleedSpreadPage = fullBleedSpreadPages.has(page.pageNumber);\n  const rareInsightsTitleColor = useRareInsightsTitleColor(page.pageNumber);\n  const seriesTheme = getSeriesThemeRule(page);\n  const isSeriesRightPage = page.pageNumber % 2 !== 0;\n'''
          if new_state not in s:
              if old_state not in s:
                  raise SystemExit('Page state insertion point not found')
              s = s.replace(old_state, new_state, 1)

          old_layout = '''    if (!rareInsightsTitleColor) return layout;\n\n    return (\n      <div\n        className="rare-insights-matched-background relative h-full w-full overflow-hidden"\n        style={{\n          backgroundColor: rareInsightsTitleColor,\n          "--rare-insights-title-color": rareInsightsTitleColor,\n        } as CSSProperties}\n      >\n        <style>{`.rare-insights-matched-background > div { background: var(--rare-insights-title-color) !important; }`}</style>\n        {layout}\n      </div>\n    );\n'''

          new_layout = '''    if (!seriesTheme && !rareInsightsTitleColor) return layout;\n\n    return (\n      <div\n        className={`series-themed-page relative h-full w-full overflow-hidden ${\n          isSeriesRightPage ? "series-right-page" : "series-left-page"\n        } ${rareInsightsTitleColor ? "rare-insights-matched-background" : ""}`}\n        data-series-theme={seriesTheme?.key}\n        style={{\n          backgroundColor: rareInsightsTitleColor || undefined,\n          "--rare-insights-title-color": rareInsightsTitleColor || undefined,\n          "--series-accent": seriesTheme?.color || undefined,\n        } as CSSProperties}\n      >\n        <style>{`\n          .rare-insights-matched-background > div {\n            background: var(--rare-insights-title-color) !important;\n          }\n          .series-themed-page * {\n            scrollbar-color: var(--series-accent) rgba(255,255,255,0.18) !important;\n          }\n          .series-themed-page *::-webkit-scrollbar-thumb {\n            background: var(--series-accent) !important;\n            border-color: transparent !important;\n          }\n          .series-themed-page *::-webkit-scrollbar-thumb:hover {\n            background: var(--series-accent) !important;\n          }\n          .series-themed-page.series-right-page .shrink-0 > p:first-of-type,\n          .series-themed-page.series-right-page header > p:first-of-type {\n            color: var(--series-accent) !important;\n          }\n        `}</style>\n        {layout}\n        {seriesTheme ? (\n          <div\n            className="pointer-events-none absolute bottom-0 left-0 right-0 z-[150] h-[10px]"\n            style={{ backgroundColor: seriesTheme.color }}\n            aria-hidden="true"\n          />\n        ) : null}\n      </div>\n    );\n'''

          if new_layout not in s:
              if old_layout not in s:
                  raise SystemExit('Existing layout wrapper not found')
              s = s.replace(old_layout, new_layout, 1)

          old_static_root = '''    <div\n      ref={pageContainerRef}\n      className="relative w-full h-full overflow-hidden"\n      data-static-community-page={\n'''
          new_static_root = '''    <div\n      ref={pageContainerRef}\n      className={`relative w-full h-full overflow-hidden ${\n        seriesTheme ? "series-themed-page" : ""\n      } ${seriesTheme && isSeriesRightPage ? "series-right-page" : ""}`}\n      data-series-theme={seriesTheme?.key}\n      style={{\n        "--series-accent": seriesTheme?.color || undefined,\n      } as CSSProperties}\n      data-static-community-page={\n'''
          if new_static_root not in s:
              if old_static_root not in s:
                  raise SystemExit('Static page root not found')
              s = s.replace(old_static_root, new_static_root, 1)

          image_end_marker = '''      ) : null}\n      {page.watermarkUrl && (\n'''
          image_end_replacement = '''      ) : null}\n      {seriesTheme ? (\n        <>\n          <style>{`\n            .series-themed-page * {\n              scrollbar-color: var(--series-accent) rgba(255,255,255,0.18) !important;\n            }\n            .series-themed-page *::-webkit-scrollbar-thumb {\n              background: var(--series-accent) !important;\n              border-color: transparent !important;\n            }\n            .series-themed-page.series-right-page .shrink-0 > p:first-of-type,\n            .series-themed-page.series-right-page header > p:first-of-type {\n              color: var(--series-accent) !important;\n            }\n          `}</style>\n          <div\n            className="pointer-events-none absolute bottom-0 left-0 right-0 z-[150] h-[10px]"\n            style={{ backgroundColor: seriesTheme.color }}\n            aria-hidden="true"\n          />\n        </>\n      ) : null}\n      {page.watermarkUrl && (\n'''
          if image_end_replacement not in s:
              if image_end_marker not in s:
                  raise SystemExit('Static series bar insertion point not found')
              s = s.replace(image_end_marker, image_end_replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ReadingView.tsx
          if git diff --cached --quiet; then
            echo "No code changes to commit."
            exit 0
          fi
          git commit -m "Apply series color rule across magazine"
          git push origin main
