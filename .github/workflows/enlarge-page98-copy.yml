name: Enlarge page 98 lower copy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enlarge-page98-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch page 98
        run: python3 .github/scripts/enlarge_page98_copy.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit page 98 change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ReadingView.tsx
          git commit -m "Increase page 98 lower copy size"
          git push origin main
