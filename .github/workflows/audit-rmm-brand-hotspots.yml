name: Audit RRM brand hotspots

on:
  push:
    branches: [rrm-hotspot-audit-20260823]

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr librsvg2-bin python3-pil
      - name: Scan artwork pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p WORKING/hotspot-audit/rendered
          python3 - <<'PY'
          import csv,json,re,subprocess
          from pathlib import Path
          from PIL import Image
          ROOT=Path('.')
          OUT=ROOT/'WORKING/hotspot-audit'
          URL='https://rarerevolutionmagazine.com/'
          assets=[
            ([90,91],'series-cover/explore_more.png',True),
            ([92,93],'series-cover/Explore_Series.png',True),
            ([94,95],'magazine-source/public/images/rare-pages/insider.png',True),
            ([96,97],'series-cover/insights.png',True),
            ([196],'magazine-source/public/images/bsyndro.png',False),
            ([197],'magazine-source/public/images/rare-pages/rare-siblings-impact-report-cover.png',False),
            ([198,199],'series-cover/ads/rare_revolution_insider_membership_clickable.svg',True),
            ([200,201],'series-cover/resources.png',True),
            ([204,205],'series-cover/References.png',True),
            ([214],'series-cover/ads/RARE_Revolution_Shop_Ad_Final_Clickable_Flags_In_Amazon_Box.svg',False),
            ([215],'magazine-source/public/brand/rrm-intro-overlay.png',False),
          ]
          def norm(s): return re.sub(r'[^a-z]+','',s.lower())
          def render(src,out):
            if src.suffix.lower()=='.svg': subprocess.run(['rsvg-convert','-o',str(out),str(src)],check=True)
            else: Image.open(src).convert('RGB').save(out)
          def get_rows(img):
            base=str(img.with_suffix(''))+'_ocr'
            subprocess.run(['tesseract',str(img),base,'--psm','11','tsv'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            rows=[]
            with open(base+'.tsv',newline='',encoding='utf-8') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                txt=(r.get('text') or '').strip()
                try: conf=float(r.get('conf') or -1)
                except: conf=-1
                if txt and conf>=20:
                  rows.append({'text':txt,'left':int(r['left']),'top':int(r['top']),'width':int(r['width']),'height':int(r['height'])})
            return rows
          def find_hits(rows):
            out=[]; words=[norm(r['text']) for r in rows]
            for i,w in enumerate(words):
              if not w.startswith('rare'): continue
              for j in range(i+1,min(i+5,len(rows))):
                if 'revolution' not in words[j]: continue
                for k in range(j+1,min(j+5,len(rows))):
                  if 'magazine' not in words[k]: continue
                  rs=rows[i:k+1]; l=min(r['left'] for r in rs); t=min(r['top'] for r in rs); rr=max(r['left']+r['width'] for r in rs); bb=max(r['top']+r['height'] for r in rs)
                  out.append((l,t,rr-l,bb-t,[r['text'] for r in rs])); break
                break
            return out
          report=[]; hotspots=[]
          for pages,path,spread in assets:
            src=ROOT/path; item={'asset':path,'pages':pages,'exists':src.exists(),'hits':[]}
            if not src.exists(): report.append(item); continue
            png=OUT/'rendered'/(src.stem+'.png'); render(src,png); W,H=Image.open(png).size
            for l,t,w,h,words in find_hits(get_rows(png)):
              px=max(4,int(W*.005)); py=max(3,int(H*.004)); l=max(0,l-px); t=max(0,t-py); w=min(W-l,w+2*px); h=min(H-t,h+2*py)
              item['hits'].append({'bbox':[l,t,w,h],'words':words,'size':[W,H]})
              if spread:
                half=W/2; idx=0 if l+w/2<half else 1; page=pages[idx]; local=max(0,l if idx==0 else l-half); local_r=min(half,(l+w) if idx==0 else (l+w-half)); x=local/half*100; ww=max(0,local_r-local)/half*100
              else:
                page=pages[0]; x=l/W*100; ww=w/W*100
              hotspots.append({'pageNumber':page,'label':'Open RARE Revolution Magazine website','href':URL,'x':round(x,3),'y':round(t/H*100,3),'width':round(ww,3),'height':round(h/H*100,3),'sourceAsset':path,'detectedText':' '.join(words)})
            report.append(item)
          (OUT/'ocr-report.json').write_text(json.dumps(report,indent=2))
          (OUT/'brand-hotspots.json').write_text(json.dumps({'destination':URL,'hotspots':hotspots},indent=2))
          lines=['# RRM brand hotspot OCR audit','',f'Destination: {URL}','']
          for item in report:
            lines.append(f"## {item['asset']} — pages {', '.join(map(str,item['pages']))}")
            lines.append('- MISSING ASSET' if not item['exists'] else ('- No exact phrase detected.' if not item['hits'] else '\n'.join(f"- Detected {' '.join(h['words'])}; bbox={h['bbox']}; size={h['size']}" for h in item['hits'])))
            lines.append('')
          lines.append('## Generated hotspots')
          lines += [f"- Page {h['pageNumber']}: x={h['x']} y={h['y']} w={h['width']} h={h['height']} ({h['sourceAsset']})" for h in hotspots]
          (OUT/'AUDIT.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKING/hotspot-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit RRM website hotspot coordinates"
          git push
