name: Remove generated footer from series covers

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-footer-from-series-covers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply series cover exclusion
        run: python3 .github/scripts/remove_footer_from_series_covers.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ReadingView.tsx
          git commit -m "Exclude major series covers from footer bands"
          git push origin main
