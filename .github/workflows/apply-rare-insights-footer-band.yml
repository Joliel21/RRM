name: Apply RARE INSIGHTS footer band

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-rare-insights-footer-band.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply footer band
        run: python3 .github/scripts/apply_rare_insights_footer_band.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit footer band
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ReadingView.tsx
          git commit -m "Apply RARE INSIGHTS footer band across series"
          git push origin main
