name: Fix People of Rare AP black

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-people-of-rare-ap-black.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply People of Rare AP color fix
        run: python3 .github/scripts/fix_people_of_rare_ap_black.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit People of Rare AP color fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ReadingView.tsx
          git commit -m "Force People of Rare AP backgrounds to black"
          git restore . || true
          git pull --rebase origin main
          git push origin main
