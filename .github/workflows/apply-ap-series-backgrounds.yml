name: Apply AP series backgrounds

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ap-series-backgrounds.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AP backgrounds
        run: python3 .github/scripts/apply_ap_series_backgrounds.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit AP background rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ReadingView.tsx
          git commit -m "Color AP article fields by series"
          git push origin main
