name: Fix series theme rule

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-series-theme-rule.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch series theming
        run: python3 .github/scripts/fix_series_theme.py

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/ReadingView.tsx
          git commit -m "Fix series colors by page identity"
          git push origin main
